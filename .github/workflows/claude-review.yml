name: Claude Review

# Revisión automática de PRs. Hoy queda DORMIDO en casi todos los repos porque
# se commitea directo a main; se activa solo si hay un PR (propio, de Dependabot
# o de un contributor externo). No consume nada mientras no haya PRs.
# Fuente de verdad:
#   LusoMagnet/05-tecnologia/claude-gh-workflows/claude-review.yml

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}

            Revisa ÚNICAMENTE el diff de este PR. Responde en español.

            Prioriza, en este orden:
            1. Bugs reales — casos límite, nulos, off-by-one, promesas sin await,
               errores tragados, condiciones invertidas.
            2. Seguridad — secretos commiteados, inyección (SQL/comando/XSS),
               authz ausente o mal aplicada, validación de entrada.
            3. Regresiones — comportamiento existente que este diff rompe.

            NO comentes estilo, formato, nombres ni preferencias personales.

            Para cada hallazgo, un comentario inline en la línea exacta, con el
            escenario concreto que falla (entrada -> resultado erróneo). Si no
            puedes describir cómo falla, no es un hallazgo: no lo publiques.

            Si el PR está bien, deja un único comentario de una línea diciéndolo.
            No inventes hallazgos para justificar la revisión.
          claude_args: |
            --max-turns 15
            --model claude-sonnet-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
